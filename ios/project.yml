name: AIDentist
options:
  bundleIdPrefix: kg.aidentist
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  AIDentist:
    type: application
    platform: iOS
    sources:
      - path: AIDentist
      - path: ../shared/launcher
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kg.aidentist.app
        PRODUCT_NAME: AIDentist
        INFOPLIST_FILE: AIDentist/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    scheme: {}
