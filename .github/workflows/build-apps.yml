name: Сборка приложений AI Dentist

on:
  push:
    branches: [mobile-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — проверочная сборка без подписи"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Сборка APK и AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee ../build.log
      - name: Файлы
        run: |
          if [ -z "${KEYSTORE_PATH:-}" ]; then echo "Код собрался, но APK без подписи не выпускаем: добавьте секреты ANDROID_KEYSTORE_*" | tee -a build.log; exit 1; fi
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/AI-Dentist.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/AI-Dentist-GooglePlay.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
      - name: Журнал ошибки → ветка ci-logs
        if: failure()
        run: bash .github/push-log.sh android build.log

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Сборка (без подписи — подписывается при установке)
        working-directory: ios
        run: |
          xcodebuild -project AIDentist.xcodeproj -target AIDentist -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../build.log | grep -E "error:|warning: .*swift|BUILD" || true
          test -d build/Release-iphoneos/AIDentist.app
          mkdir -p Payload ../out
          cp -R build/Release-iphoneos/AIDentist.app Payload/
          zip -qry ../out/AI-Dentist-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/
      - name: Журнал ошибки → ветка ci-logs
        if: failure()
        run: bash .github/push-log.sh ios build.log

  release:
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          ls -la dist
          gh release create "app-v$V" dist/* --target "${{ github.sha }}" \
            --title "AI Dentist $V" --notes-file .github/release-notes.md --latest
